<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIDE QUEST CLUB - the shirt that starts side quests</title>
<meta name="description" content="A shirt with a QR code on the back. People scan it, get a side quest, and you do it together. Side Quest Club gets people out of their comfort zone and talking to each other.">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="#home">SIDE QUEST CLUB</a>
    <div class="right">
      <button class="lang" id="lang" aria-label="Language">ES</button>
      <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i><span class="peek" aria-hidden="true">👀</span></button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden>
    <button class="x" id="menuClose" aria-label="Close">✕</button>
    <a href="#home"><span data-i18n="mHome"></span><small data-i18n="mHomeS"></small></a>
    <a href="p/?s=demo" id="tryLink"><span data-i18n="mTry"></span><small data-i18n="mTryS"></small></a>
    <a href="#wall"><span data-i18n="mWall"></span><small data-i18n="mWallS"></small></a>
    <a href="#about"><span data-i18n="mAbout"></span><small data-i18n="mAboutS"></small></a>
    <a href="#club"><span data-i18n="mClub"></span><small data-i18n="mClubS"></small></a>
    <div class="foot">SIDE QUEST CLUB · Madrid</div>
  </nav>

  <main>
    <!-- ===== HOME ===== -->
    <section id="v-home" hidden style="padding:0">
      <div class="hero">
        <div class="kicker" data-i18n="hKicker"></div>
        <h1 class="display"><span>SIDE</span><span class="ink">QUEST</span><span>CLUB</span></h1>
        <svg class="loop" viewBox="0 0 340 60" aria-hidden="true"><path d="M8 34C60 10 150 4 220 12c50 6 70 22 40 32-34 11-110 8-130-6-16-12 30-26 96-24 40 1 78 12 98 30m0 0-4-17m4 17-17-1"/></svg>
        <p class="lede" data-i18n="hLede"></p>
        <p class="ctaq" data-i18n="ctaQ"></p>
        <div class="stack">
          <a class="btn red ring" href="#club" data-i18n="ctaList"></a>
          <a class="btn" href="p/?s=demo" data-i18n="ctaTry"></a>
        </div>
      </div>
      <section>
        <h2 class="display" data-i18n="howH"></h2>
        <div class="steps">
          <div class="step"><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
          <div class="step"><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
          <div class="step"><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
        </div>
      </section>
      <section>
        <h2 class="display" data-i18n="questsH"></h2>
        <p class="sub" data-i18n="questsP"></p>
        <div class="chips" id="chips"></div>
      </section>
      <section class="stack">
        <a class="btn" href="#about" data-i18n="hAbout"></a>
        <a class="btn" href="#wall" data-i18n="hWall"></a>
      </section>
      <section>
        <div class="wlbox">
          <h2 class="display" data-i18n="listH"></h2>
          <p class="sub" data-i18n="listP"></p>
          <div class="coupon"><span class="sc" aria-hidden="true">✂</span><b data-i18n="coupon"></b><small data-i18n="couponS"></small></div>
        <form class="wl" data-source="home" novalidate>
            <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
            <p class="wlerr" hidden></p>
            <button class="btn red" type="submit"></button>
          </form>
          <p class="demo" hidden></p>
        </div>
      </section>
    </section>

    <!-- ===== WALL ===== -->
    <section class="page" id="v-wall" hidden>
      <div class="kicker" data-i18n="wallKicker"></div>
      <h1 class="display" data-i18n="wallTitle"></h1>
      <p class="sub" data-i18n="wallSub"></p>
      <form class="wallform" id="wallForm">
        <textarea id="wallText" rows="3" maxlength="280" required data-i18n-ph="wallPh"></textarea>
        <input type="text" id="wallIg" maxlength="31" autocapitalize="off" autocorrect="off" autocomplete="off" data-i18n-ph="igPh">
        <button class="btn red" type="submit" id="wallSend" data-i18n="wallSend"></button>
      </form>
      <div class="wallbg"><div class="msgs" id="msgs"></div></div>
      <p class="smallnote" id="wallDemo" hidden data-i18n="wallDemo"></p>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="page" id="v-about" hidden>
      <div class="kicker" data-i18n="abKicker"></div>
      <h1 class="display" data-i18n="abTitle"></h1>
      <p class="big" data-i18n="abVision"></p>
      <h2 data-i18n="abMissionH"></h2>
      <p data-i18n="abMission"></p>
      <p data-i18n="abMission2"></p>
      <h2 data-i18n="abWhoH"></h2>
      <p data-i18n="abWho1"></p>
      <p data-i18n="abWho2"></p>
      <p data-i18n="abWho3"></p>
      <span class="sig">- Aron</span>
      <p class="igline"><span data-i18n="abIg"></span> <a href="https://instagram.com/aron_toth_" target="_blank" rel="noopener">@aron_toth_</a></p>
      <div class="stack" style="margin-top:26px">
        <a class="btn red ring" href="#club" data-i18n="abCta"></a>
      </div>
    </section>

    <!-- ===== CLUB ===== -->
    <section class="page" id="v-club" hidden>
      <div class="kicker" data-i18n="clKicker"></div>
      <h1 class="display" data-i18n="clTitle"></h1>
      <p data-i18n="clIntro"></p>
      <div class="cards">
        <div class="cardx">
          <div class="art"><svg viewBox="0 0 300 140" class="a-shirt" aria-hidden="true">
            <path class="tee" d="M70 30L95 18Q110 28 125 18L150 30 170 55 152 66 146 58V128H74V58L68 66 50 55Z"/>
            <g class="qr"><rect x="92" y="62" width="36" height="36" rx="2" class="qbg"/>
              <path d="M95 65h9v9h-9zM116 65h9v9h-9zM95 86h9v9h-9z" class="qd"/>
              <path d="M107 66h3v3h-3zM107 72h6v3h-6zM98 77h3v6h-3zM104 78h6v3h-6zM113 77h3v3h-3zM119 78h6v3h-6zM110 84h3v6h-3zM116 86h3v3h-3zM122 85h3v9h-3zM107 91h3v4h-3zM116 92h4v3h-4z" class="qd"/></g>
            <rect class="beam" x="88" y="60" width="44" height="3" rx="1.5"/>
            <g class="phone"><rect x="205" y="34" width="56" height="98" rx="10"/><rect x="211" y="46" width="44" height="74" rx="4" class="scr"/>
              <path class="pstar" d="M233 66l3.6 7.3 8 1.2-5.8 5.6 1.4 8-7.2-3.8-7.2 3.8 1.4-8-5.8-5.6 8-1.2z"/>
              <rect class="pl" x="218" y="96" width="30" height="4" rx="2"/><rect class="pl" x="222" y="104" width="22" height="4" rx="2"/></g>
            <path class="ray" d="M140 80C165 70 185 70 200 78" />
          </svg></div>
          <span class="tag" data-i18n="tagFirst"></span><h3 data-i18n="c1h"></h3><p data-i18n="c1p"></p>
        </div>
        <div class="cardx">
          <div class="art pass">
            <svg viewBox="0 -8 150 158" class="a-guy" aria-hidden="true">
              <!-- arms -->
              <path class="skin" d="M38 64C28 68 24 80 24 96L22 150H40L42 104 46 84Z"/>
              <path class="skin" d="M112 64C122 68 126 80 126 96L128 150H110L108 104 104 84Z"/>
              <!-- torso -->
              <path class="skin" d="M64 50C56 56 44 58 38 64 34 72 42 80 46 84 48 100 50 124 54 150H96C100 124 102 100 104 84 108 80 116 72 112 64 106 58 94 56 86 50Z"/>
              <path class="shade" d="M47 84C50 100 52 122 55 148L58 148C56 124 55 104 54 92Z"/>
              <path class="shade" d="M103 84C100 100 98 122 95 148L92 148C94 124 95 104 96 92Z"/>
              <!-- muscle lines -->
              <path class="ln" d="M75 66V150"/>
              <path class="ln" d="M48 70C56 66 68 68 74 74M102 70C94 66 82 68 76 74"/>
              <path class="ln" d="M49 84C56 94 68 95 74 89M101 84C94 94 82 95 76 89"/>
              <path class="ln" d="M63 102Q68 100 73 102M77 102Q82 100 87 102M62 114Q68 112 73 114M77 114Q82 112 88 114M62 126Q68 124 73 126M77 126Q82 124 88 126"/>
              <path class="ln" d="M56 98C58 112 59 128 62 144M94 98C92 112 91 128 88 144"/>
              <path class="ln" d="M38 64C40 72 44 78 46 84M112 64C110 72 106 78 104 84"/>
              <!-- neck + head -->
              <path class="skin" d="M66 40H84V54C80 58 70 58 66 54Z"/>
              <path class="skin" d="M59 28C59 16 66 9 75 9S91 16 91 28C91 38 85 47 75 47S59 38 59 28Z"/>
              <path class="skin" d="M59 27C55 26 55 34 59 35M91 27C95 26 95 34 91 35"/>
              <path class="stub" d="M62 34C64 42 69 46 75 46S86 42 88 34C85 39 80 41 75 41S65 39 62 34Z"/>
              <path class="hair" d="M57 27C55 13 63 4 75 4 82 4 88 6 92 11 95 15 95 21 93 27 92 22 90 19 87 17 84 20 78 21 72 19 68 18 63 20 61 24Z"/>
              <path class="hair" d="M66 7C72 1 84 1 90 7 85 5 79 5 74 8Z"/>
              <path class="brow" d="M64 24Q68 22 72 24M78 24Q82 22 86 24"/>
              <path class="eye" d="M66 28Q68.5 26.5 71 28M79 28Q81.5 26.5 84 28"/>
              <path class="ln" d="M75 29V35L73 36"/>
              <path class="smile" d="M69 39Q75 43 81 39"/>
              <!-- pass -->
              <g class="lanyard"><path class="cord" d="M68 54L72 88M82 54L78 88"/>
                <rect x="63" y="86" width="24" height="17" rx="3" class="badge"/><text x="75" y="98" class="bt">PASS</text></g>
              <path class="spark s1" d="M128 40l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
              <path class="spark s2" d="M20 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
            </svg>
            <div class="lb"><div class="lbh" data-i18n="lbTonight"></div>
              <div class="lr"><span data-i18n="lbYou"></span><i style="--w:92%;--d:0s"></i><b>7</b></div>
              <div class="lr"><span>Lena</span><i style="--w:70%;--d:.2s"></i><b>5</b></div>
              <div class="lr"><span>Marco</span><i style="--w:45%;--d:.4s"></i><b>3</b></div>
            </div>
          </div>
          <span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c2h"></h3><p data-i18n="c2p"></p>
        </div>
        <div class="cardx">
          <div class="art squad" aria-hidden="true">
            <span class="crown">👑</span>
            <svg viewBox="0 0 60 56"><path d="M15 6L24 2Q30 6 36 2L45 6 56 18 48 24 45 20V54H15V20L12 24 4 18Z"/><g class="mq"><rect class="b" x="22" y="24" width="16" height="16" rx="1"/><path class="d" d="M24 26h4v4h-4zM32 26h4v4h-4zM24 34h4v4h-4zM30 30h2v2h-2zM33 32h3v2h-3zM30 35h2v3h-2zM34 36h2v2h-2z"/></g></svg>
            <svg viewBox="0 0 60 56"><path d="M15 6L24 2Q30 6 36 2L45 6 56 18 48 24 45 20V54H15V20L12 24 4 18Z"/><g class="mq"><rect class="b" x="22" y="24" width="16" height="16" rx="1"/><path class="d" d="M24 26h4v4h-4zM32 26h4v4h-4zM24 34h4v4h-4zM30 30h2v2h-2zM33 32h3v2h-3zM30 35h2v3h-2zM34 36h2v2h-2z"/></g></svg>
            <svg viewBox="0 0 60 56"><path d="M15 6L24 2Q30 6 36 2L45 6 56 18 48 24 45 20V54H15V20L12 24 4 18Z"/><g class="mq"><rect class="b" x="22" y="24" width="16" height="16" rx="1"/><path class="d" d="M24 26h4v4h-4zM32 26h4v4h-4zM24 34h4v4h-4zM30 30h2v2h-2zM33 32h3v2h-3zM30 35h2v3h-2zM34 36h2v2h-2z"/></g></svg>
            <svg viewBox="0 0 60 56"><path d="M15 6L24 2Q30 6 36 2L45 6 56 18 48 24 45 20V54H15V20L12 24 4 18Z"/><g class="mq"><rect class="b" x="22" y="24" width="16" height="16" rx="1"/><path class="d" d="M24 26h4v4h-4zM32 26h4v4h-4zM24 34h4v4h-4zM30 30h2v2h-2zM33 32h3v2h-3zM30 35h2v3h-2zM34 36h2v2h-2z"/></g></svg>
          </div>
          <span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c3h"></h3><p data-i18n="c3p"></p>
        </div>
        <div class="cardx">
          <div class="art packs" aria-hidden="true">
            <div class="pk p1"><em>🌍</em><b data-i18n="pk1"></b><small data-i18n="pkWord"></small></div>
            <div class="pk p2"><em>🌶️</em><b data-i18n="pk2"></b><small data-i18n="pkWord"></small></div>
            <div class="pk p3"><em>⛺</em><b data-i18n="pk3"></b><small data-i18n="pkWord"></small></div>
            <div class="pk p4"><em>🐻</em><b data-i18n="pk4"></b><small data-i18n="pkWord"></small></div>
          </div>
          <span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c4h"></h3><p data-i18n="c4p"></p>
        </div>
      </div>
      <div class="wlbox">
        <h2 class="display" data-i18n="listH"></h2>
        <p class="sub" data-i18n="listP"></p>
        <div class="coupon"><span class="sc" aria-hidden="true">✂</span><b data-i18n="coupon"></b><small data-i18n="couponS"></small></div>
        <form class="wl" data-source="club-page" novalidate>
          <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
          <p class="wlerr" hidden></p>
          <button class="btn red" type="submit"></button>
        </form>
        <p class="demo" hidden></p>
      </div>
    </section>
  </main>
  <footer>SIDE QUEST CLUB · Madrid</footer>
</div>
<script src="js/text.js"></script>
<script src="js/common.js"></script>
<script src="js/quests.js"></script>
<script src="js/home.js"></script>
</body>
</html>
