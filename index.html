<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIDE QUEST CLUB — the shirt that starts side quests</title>
<meta name="description" content="A shirt with a QR code on the back. People scan it, get a side quest, and you do it together. Side Quest Club gets people out of their comfort zone and talking to each other.">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="#home">SIDE QUEST CLUB</a>
    <div class="right">
      <button class="lang" id="lang" aria-label="Language">ES</button>
      <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i><span class="peek" aria-hidden="true">👀</span></button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden>
    <button class="x" id="menuClose" aria-label="Close">✕</button>
    <a href="#home"><span data-i18n="mHome"></span><small data-i18n="mHomeS"></small></a>
    <a href="p/?s=demo" id="tryLink"><span data-i18n="mTry"></span><small data-i18n="mTryS"></small></a>
    <a href="#wall"><span data-i18n="mWall"></span><small data-i18n="mWallS"></small></a>
    <a href="#about"><span data-i18n="mAbout"></span><small data-i18n="mAboutS"></small></a>
    <a href="#club"><span data-i18n="mClub"></span><small data-i18n="mClubS"></small></a>
    <div class="foot">SIDE QUEST CLUB · Madrid</div>
  </nav>

  <main>
    <!-- ===== HOME ===== -->
    <section id="v-home" hidden style="padding:0">
      <div class="hero">
        <div class="kicker" data-i18n="hKicker"></div>
        <h1 class="display"><span>SIDE</span><span class="ink">QUEST</span><span>CLUB</span></h1>
        <svg class="loop" viewBox="0 0 340 60" aria-hidden="true"><path d="M8 34C60 10 150 4 220 12c50 6 70 22 40 32-34 11-110 8-130-6-16-12 30-26 96-24 40 1 78 12 98 30m0 0-4-17m4 17-17-1"/></svg>
        <p class="lede" data-i18n="hLede"></p>
        <div class="stack">
          <a class="btn red" href="#club" data-i18n="ctaList"></a>
          <a class="btn" href="p/?s=demo" data-i18n="ctaTry"></a>
        </div>
      </div>
      <section>
        <h2 class="display" data-i18n="howH"></h2>
        <div class="steps">
          <div class="step"><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
          <div class="step"><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
          <div class="step"><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
        </div>
      </section>
      <section>
        <h2 class="display" data-i18n="questsH"></h2>
        <p class="sub" data-i18n="questsP"></p>
        <div class="chips" id="chips"></div>
      </section>
      <section class="stack">
        <a class="btn" href="#about" data-i18n="hAbout"></a>
        <a class="btn" href="#wall" data-i18n="hWall"></a>
      </section>
      <section>
        <div class="wlbox">
          <h2 class="display" data-i18n="listH"></h2>
          <p class="sub" data-i18n="listP"></p>
          <form class="wl" data-source="home" novalidate>
            <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
            <p class="wlerr" hidden></p>
            <button class="btn red" type="submit"></button>
          </form>
          <p class="demo" hidden></p>
        </div>
      </section>
    </section>

    <!-- ===== WALL ===== -->
    <section class="page" id="v-wall" hidden>
      <div class="kicker" data-i18n="wallKicker"></div>
      <h1 class="display" data-i18n="wallTitle"></h1>
      <p class="sub" data-i18n="wallSub"></p>
      <form class="wallform" id="wallForm">
        <textarea id="wallText" rows="3" maxlength="280" required data-i18n-ph="wallPh"></textarea>
        <input type="text" id="wallIg" maxlength="31" autocapitalize="off" autocorrect="off" autocomplete="off" data-i18n-ph="igPh">
        <button class="btn red" type="submit" id="wallSend" data-i18n="wallSend"></button>
      </form>
      <div class="wallbg"><div class="msgs" id="msgs"></div></div>
      <p class="smallnote" id="wallDemo" hidden data-i18n="wallDemo"></p>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="page" id="v-about" hidden>
      <div class="kicker" data-i18n="abKicker"></div>
      <h1 class="display" data-i18n="abTitle"></h1>
      <p class="big" data-i18n="abVision"></p>
      <h2 data-i18n="abMissionH"></h2>
      <p data-i18n="abMission"></p>
      <p data-i18n="abMission2"></p>
      <h2 data-i18n="abWhoH"></h2>
      <p data-i18n="abWho1"></p>
      <p data-i18n="abWho2"></p>
      <p data-i18n="abWho3"></p>
      <span class="sig">— Aron</span>
      <div class="stack" style="margin-top:26px">
        <a class="btn red" href="#club" data-i18n="abCta"></a>
      </div>
    </section>

    <!-- ===== CLUB ===== -->
    <section class="page" id="v-club" hidden>
      <div class="kicker" data-i18n="clKicker"></div>
      <h1 class="display" data-i18n="clTitle"></h1>
      <p data-i18n="clIntro"></p>
      <div class="cards">
        <div class="cardx"><span class="tag" data-i18n="tagFirst"></span><h3 data-i18n="c1h"></h3><p data-i18n="c1p"></p></div>
        <div class="cardx"><span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c2h"></h3><p data-i18n="c2p"></p></div>
        <div class="cardx"><span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c3h"></h3><p data-i18n="c3p"></p></div>
        <div class="cardx"><span class="tag" data-i18n="tagPlan"></span><h3 data-i18n="c4h"></h3><p data-i18n="c4p"></p></div>
      </div>
      <div class="wlbox">
        <h2 class="display" data-i18n="listH"></h2>
        <p class="sub" data-i18n="listP"></p>
        <form class="wl" data-source="club-page" novalidate>
          <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
          <p class="wlerr" hidden></p>
          <button class="btn red" type="submit"></button>
        </form>
        <p class="demo" hidden></p>
      </div>
    </section>
  </main>
  <footer>SIDE QUEST CLUB · Madrid</footer>
</div>
<script src="js/text.js"></script>
<script src="js/common.js"></script>
<script src="js/quests.js"></script>
<script src="js/home.js"></script>
</body>
</html>
