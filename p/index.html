<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIDE QUEST CLUB — spin a side quest</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8ef">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="../">SIDE QUEST CLUB</a>
    <button class="lang" id="lang" aria-label="Language">ES</button>
  </header>

  <main class="play">
    <!-- SPIN -->
    <div id="v-spin">
      <div class="kicker" data-i18n="found"></div>
      <h1 class="display" data-i18n="spinTitle"></h1>
      <p class="sub" data-i18n="spinSub"></p>
      <div class="machine">
        <div class="lbl" data-i18n="yourQuest"></div>
        <div class="window"><div class="reel q" id="reel">? ? ?</div></div>
      </div>
      <label class="devil"><input type="checkbox" id="devil"><span data-i18n="devil"></span></label>
      <div class="stack" id="preSpin">
        <button class="btn red big" id="spinBtn" data-i18n="spin"></button>
      </div>
      <div class="stack" id="postSpin" hidden>
        <button class="btn red" id="acceptBtn" data-i18n="accept"></button>
        <button class="btn" id="againBtn" data-i18n="again"></button>
      </div>
    </div>

    <!-- ACCEPTED -->
    <div id="v-accept" hidden>
      <div class="kicker" data-i18n="accKicker"></div>
      <div class="ticket"><small>Side Quest</small><div id="accText"></div></div>
      <p class="note" data-i18n="accNote"></p>
      <div class="stack">
        <button class="btn red" id="doneBtn" data-i18n="done"></button>
        <button class="btn plain" id="changeBtn" data-i18n="change"></button>
      </div>
    </div>

    <!-- DONE -->
    <div id="v-done" hidden>
      <div class="trophy">🏆</div>
      <h1 class="display" data-i18n="doneTitle"></h1>
      <p class="sub" data-i18n="doneSub"></p>
      <div class="wlbox light" style="text-align:left;margin:22px 0">
        <h2 class="display" data-i18n="pitchH"></h2>
        <p class="sub" data-i18n="pitchP"></p>
        <form class="wl" novalidate>
          <input type="text" name="contact" autocomplete="email" autocapitalize="off" autocorrect="off" maxlength="80" aria-label="Email or Instagram">
          <p class="wlerr" hidden></p>
          <button class="btn red" type="submit"></button>
        </form>
        <p class="demo" hidden></p>
      </div>
      <button class="btn" id="anotherBtn" data-i18n="another"></button>
    </div>

    <p class="shirtid" id="shirtId"></p>
  </main>
</div>

<script src="../js/common.js"></script>
<script src="../js/quests.js"></script>
<script>
const T = {
  en:{ found:'You found a club member 👀', spinTitle:'Spin for a side quest', spinSub:'Whatever comes up, you do it together with the person in the shirt. Tonight. No excuses.',
    yourQuest:'Your side quest', devil:'Devil mode 😈', spin:'SPIN', accept:'We’re in 🔥', again:'Spin again 🎰',
    accKicker:'Quest accepted', accNote:'Show this screen to the person in the shirt — and go do it.', done:'We did it ✅', change:'Pick a different one',
    doneTitle:'Quest complete', doneSub:'Legend status unlocked. You now officially know each other.',
    pitchH:'Want people to scan <i>you</i>?', pitchP:'Get your own Side Quest Club shirt. Leave your email or Instagram — the first drop goes to the list, with a launch discount.',
    another:'Another quest 🎰', shirt:'Shirt' },
  es:{ found:'Has encontrado a alguien del club 👀', spinTitle:'Gira y consigue una side quest', spinSub:'Lo que salga, lo hacéis juntos con quien lleva la camiseta. Esta noche. Sin excusas.',
    yourQuest:'Tu side quest', devil:'Modo diablo 😈', spin:'GIRAR', accept:'¡Vamos! 🔥', again:'Girar otra vez 🎰',
    accKicker:'Quest aceptada', accNote:'Enséñale esta pantalla a quien lleva la camiseta — y a por ello.', done:'¡Hecha! ✅', change:'Elegir otra',
    doneTitle:'Quest completada', doneSub:'Estatus de leyenda desbloqueado. Oficialmente, ya os conocéis.',
    pitchH:'¿Quieres que te escaneen <i>a ti</i>?', pitchP:'Consigue tu camiseta de Side Quest Club. Deja tu email o Instagram — el primer drop es para la lista, con descuento de lanzamiento.',
    another:'Otra quest 🎰', shirt:'Camiseta' }
};
const $ = id => document.getElementById(id);
const shirt = (new URLSearchParams(location.search).get('s') || '').replace(/[^\w-]/g,'').slice(0,12);
let current = null, spinning = false, seen = [];

const deck = () => $('devil').checked ? QUESTS.devil : QUESTS.classic;
const txt = q => q[LANG === 'es' ? 1 : 0];
function show(v){ ['spin','accept','done'].forEach(n => $('v-'+n).hidden = n !== v); window.scrollTo(0,0); }
function resetSpin(){ current = null; const r = $('reel'); r.className = 'reel q'; r.textContent = '? ? ?'; $('preSpin').hidden = false; $('postSpin').hidden = true; }

function pick(){
  const d = deck(); let pool = d.filter(q => !seen.includes(q));
  if (!pool.length){ seen = seen.filter(q => !d.includes(q)); pool = d; }
  const q = pool[Math.floor(Math.random()*pool.length)]; seen.push(q); return q;
}
function spin(){
  if (spinning) return; spinning = true;
  $('preSpin').hidden = false; $('postSpin').hidden = true; $('spinBtn').disabled = true;
  const r = $('reel'), d = deck(), final = pick();
  r.className = 'reel'; let i = 0; const steps = 16;
  (function step(){
    r.classList.remove('tick'); void r.offsetWidth;
    if (i < steps){ r.textContent = txt(d[Math.floor(Math.random()*d.length)]); r.classList.add('tick'); i++; setTimeout(step, 60 + i*i*1.6); }
    else { current = final; r.textContent = txt(final); r.classList.add('land'); if (navigator.vibrate) navigator.vibrate(40);
      spinning = false; $('spinBtn').disabled = false; $('preSpin').hidden = true; $('postSpin').hidden = false; }
  })();
}
$('spinBtn').onclick = spin;
$('againBtn').onclick = spin;
$('acceptBtn').onclick = () => { $('accText').textContent = txt(current); show('accept'); };
$('changeBtn').onclick = () => { resetSpin(); show('spin'); };
$('doneBtn').onclick = () => show('done');
$('anotherBtn').onclick = () => { resetSpin(); show('spin'); };
$('devil').onchange = () => { document.body.classList.toggle('hot', $('devil').checked); if (!spinning) resetSpin(); };
document.addEventListener('langchange', () => {
  if (current && !spinning){ $('reel').textContent = txt(current); $('accText').textContent = txt(current); }
  $('shirtId').textContent = shirt && shirt !== 'demo' ? t('shirt') + ' #' + shirt : '';
});
initLang(T);
initWaitlist('scan');
</script>
</body>
</html>
