<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIDE QUEST CLUB - your side quest</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <span class="mark display">SIDE QUEST CLUB</span>
    <div class="right">
      <button class="lang" id="lang" aria-label="Language">ES</button>
      <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i><span class="peek" aria-hidden="true">👀</span></button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden>
    <button class="x" id="menuClose" aria-label="Close">✕</button>
    <a href="#" id="mSpinLink"><span data-i18n="mSpin"></span><small data-i18n="mSpinS"></small></a>
    <a data-to="wall"><span data-i18n="mWall"></span><small data-i18n="mWallS"></small></a>
    <a data-to="about"><span data-i18n="mAbout"></span><small data-i18n="mAboutS"></small></a>
    <a data-to="club"><span data-i18n="mClub"></span><small data-i18n="mClubS"></small></a>
    <div class="foot">SIDE QUEST CLUB · Madrid</div>
  </nav>

  <main>
    <!-- ===== LANGUAGE ===== -->
    <section class="gate" id="v-lang" hidden>
      <h1 class="display"><span>SIDE</span><span class="ink">QUEST</span><span>CLUB</span></h1>
      <p class="sub">Choose your language · Elige tu idioma</p>
      <div class="stack" id="langBtns"></div>
    </section>

    <!-- ===== QUOTE ===== -->
    <section class="quote" id="v-quote" hidden>
      <svg class="routes" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><mask id="rm" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
          <path class="m" pathLength="1" d="M-10 120C60 60 120 190 200 130S330 40 400 110"/>
          <path class="m" pathLength="1" d="M400 500C330 550 300 450 230 500S90 580 30 520-20 550-20 550"/>
          <path class="m" pathLength="1" d="M-10 640C70 580 110 700 190 650S300 560 340 620 400 700 400 700"/>
          <path class="m" pathLength="1" d="M60 860C90 790 180 820 210 760S300 740 330 790"/>
        </mask></defs>
        <g mask="url(#rm)">
          <path class="r" d="M-10 120C60 60 120 190 200 130S330 40 400 110"/>
          <path class="r red" d="M400 500C330 550 300 450 230 500S90 580 30 520-20 550-20 550"/>
          <path class="r red" d="M-10 640C70 580 110 700 190 650S300 560 340 620 400 700 400 700"/>
          <path class="r" d="M60 860C90 790 180 820 210 760S300 740 330 790"/>
        </g>
        <path class="x" d="M322 782l16 16m0-16-16 16M192 122l16 16m0-16-16 16"/>
      </svg>
      <p data-i18n="quote"></p>
      <div class="q2" data-i18n="quote2"></div>
      <small data-i18n="tap"></small>
    </section>

    <!-- ===== SPIN ===== -->
    <section class="play" id="v-spin" hidden>
      <div class="kicker" id="foundKicker"></div>
      <h1 class="display" data-i18n="spinTitle"></h1>
      <p class="sub" id="spinSub"></p>
      <div class="machine" id="machine">
        <svg class="map" id="map" viewBox="0 0 320 124" aria-hidden="true">
          <text class="lbl-usual" id="lblUsual" x="16" y="80"></text>
          <text class="lbl-side" id="lblSide" x="16" y="46"></text>
          <path class="trailpath" id="trail" d="M16 62H104C118 62 126 28 140 28S166 96 180 96 206 28 220 28 246 96 260 96 284 30 296 30"/>
          <path class="road" d="M16 62H304"/>
          <path class="walked" id="walked" d="M16 62H104C118 62 126 28 140 28S166 96 180 96 206 28 220 28 246 96 260 96 284 30 296 30"/>
          <path class="walked" id="walkedStraight" d="M16 62H104"/>
          <g id="pins"></g>
          <g transform="translate(296 30)"><g class="goal" id="goal">
            <path class="rays" d="M0-24v6M17-17l-4 4M-17-17l4 4M25 0h-6M-25 0h6"/>
            <path class="star" d="M0-14l4.4 9 9.9 1.4-7.2 7 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.2-7 9.9-1.4z"/>
          </g></g>
          <circle class="runner" id="runner" r="8" cx="16" cy="62"/>
        </svg>
        <div class="window"><div class="lbl" data-i18n="unlocked"></div><div class="reel q" id="reel">? ? ?</div></div>
      </div>
      <div class="stack" id="preSpin"><button class="btn red big" id="spinBtn" data-i18n="spin"></button></div>
      <div class="row2" id="postSpin" hidden>
        <button class="btn red" id="acceptBtn" data-i18n="accept"></button>
        <button class="btn" id="againBtn" data-i18n="again"></button>
      </div>
      <label class="devil"><input type="checkbox" id="devil"><span data-i18n="devil"></span></label>
      <div class="how">
        <div><b>1</b><span data-i18n="how1"></span></div>
        <div><b>2</b><span id="how2"></span></div>
        <div><b>3</b><span data-i18n="how3"></span></div>
      </div>
    </section>

    <!-- ===== ACCEPTED ===== -->
    <section class="play" id="v-accept" hidden>
      <div class="kicker" data-i18n="accKicker"></div>
      <div class="ticket"><small>Side Quest</small><div id="accText"></div></div>
      <p class="note" id="accNote"></p>
      <div class="stack">
        <button class="btn red" id="doneBtn" data-i18n="done"></button>
        <button class="btn plain" id="changeBtn" data-i18n="change"></button>
      </div>
    </section>

    <!-- ===== DONE + reveal ===== -->
    <section class="play" id="v-done" hidden>
      <div class="trophy">🏆</div>
      <h1 class="display" data-i18n="doneTitle"></h1>
      <p class="sub" data-i18n="doneSub"></p>
      <div class="wlbox light" style="text-align:left;margin:22px 0">
        <div class="twist" data-i18n="twist"></div>
        <h2 class="display" data-i18n="pitchH"></h2>
        <p class="sub" data-i18n="pitchP"></p>
        <div class="coupon"><span class="sc" aria-hidden="true">✂</span><b data-i18n="coupon"></b><small data-i18n="couponS"></small></div>
        <form class="wl" data-source="after-quest" novalidate>
          <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
          <p class="wlerr" hidden></p>
          <button class="btn red" type="submit"></button>
        </form>
        <p class="demo" hidden></p>
        <a class="more" data-to="club" data-i18n="seePlan"></a>
      </div>
      <div class="stack">
        <button class="btn" id="anotherBtn" data-i18n="another"></button>
        <a class="btn plain" data-to="wall" data-i18n="toWall"></a>
      </div>
    </section>
  </main>
</div>
<script src="../js/text.js"></script>
<script src="../js/common.js"></script>
<script src="../js/quests.js"></script>
<script src="../js/shirts.js"></script>
<script src="../js/play.js"></script>
</body>
</html>
